<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc cá nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Quản lý công việc</h1>
    
    <div id="notification"></div>

    <div class="summary">
        <div>Tổng cộng: <span id="total-tasks">0</span></div>
        <div>Đã hoàn thành: <span id="completed-tasks">0</span></div>
        <div>Chưa hoàn thành: <span id="pending-tasks">0</span></div>
    </div>

    <button class="btn-add" id="btn-open-add">Thêm công việc mới</button>

    <div class="task-list" id="task-list">
        </div>
</div>

<div class="modal" id="task-modal">
    <div class="modal-content">
        <h2 id="modal-title">Thêm công việc</h2>
        <form id="task-form">
            <input type="hidden" id="task-id"> <div class="form-group">
                <label>Tiêu đề *</label>
                <input type="text" id="task-title" placeholder="Nhập tiêu đề...">
                <div class="error-message" id="err-title">Tiêu đề không được để trống</div>
            </div>
            
            <div class="form-group">
                <label>Mô tả ngắn</label>
                <input type="text" id="task-desc" placeholder="Nhập mô tả...">
            </div>
            
            <div class="form-group">
                <label>Hạn hoàn thành *</label>
                <input type="date" id="task-date">
                <div class="error-message" id="err-date">Ngày không hợp lệ</div>
            </div>
            
            <div class="form-group">
                <label>Mức ưu tiên</label>
                <select id="task-priority">
                    <option value="Thấp">Thấp</option>
                    <option value="Trung bình" selected>Trung bình</option>
                    <option value="Cao">Cao</option>
                </select>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-add">Lưu công việc</button>
                <button type="button" class="btn-close" id="btn-close-modal">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
